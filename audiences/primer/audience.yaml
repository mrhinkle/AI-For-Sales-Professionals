# AI Primer: the 60-minute remote session for a sales team, unbranded, built around setting Claude up.
# Inherits everything from audiences/master/audience.yaml; only the differences are here.
title: Selling with AI
subtitle: Claude gives you superpowers, but only if you set it up. Here's how, and what to do this week.
eyebrow: ai primer · 60 minutes
footer: AI Primer
date: 2026-11-04
length: short
duration_minutes: 60
format: remote
brand: aie
vars:
  company: "[company]"
  product: "[product]"
  buyer: "[buyer]"
  crm: HubSpot or Salesforce
  sequencer: Apollo
  recorder: Zoom's AI Companion or a recorder like Fireflies
  demo_account: a real target account
  assistant: Claude, ChatGPT or Gemini
modules:
  - id: 00-opening
    override: overrides/00-opening.md
    minutes: 4
  - id: 01-where-ai-fits
    minutes: 4
    exclude: [the-week]
  - id: claude-setup
    override: overrides/claude-setup.md
  - id: 02-three-files
    minutes: 3
    exclude: [divider, brief-like-a-new-hire, three-habits, exercise-voice-file]
  - id: claude-skills
    override: overrides/claude-skills.md
    minutes: 5
  - id: 03-research
    minutes: 6
    exclude: [collect-sources, exercise-research]
  - id: prospector
    override: overrides/prospector.md
  - id: 04-outreach
    minutes: 3
    exclude: [divider, personalization, first-touch, demo-outreach, sequences, exercise-outreach]
  - id: 05-calls
    minutes: 4
    exclude: [prep-prompt, roleplay, exercise-roleplay]
  - id: 08-guardrails
    minutes: 3
  - id: 09-first-week
    minutes: 2
    exclude: [measure, pick-one]
  - id: chatterbuilt-mail
    override: overrides/chatterbuilt-mail.md
    minutes: 8
  - id: 99-close
# PowerPoint build (deck-pptx/build.mjs): brand tokens and the footer section strip.
pptx:
  brand: aie
  strip:
    01-where-ai-fits: FIT
    claude-setup: TOOLS
    02-three-files: FILES
    claude-skills: SKILLS
    03-research: RESEARCH
    prospector: OUTREACH
    04-outreach: OUTREACH
    05-calls: CALLS
    08-guardrails: RULES
    09-first-week: WEEK
    chatterbuilt-mail: MAIL
